colorScheme          = "slate"
defaultAppearance    = "auto"
autoSwitchAppearance = true
enableDarkModeToggle = true
enableSearch         = true
enableCodeCopy       = true
mainSections         = ["post", "talk"]
images               = ["img/James-Pogran-avatar.jpg"]

[social]
  twitter = "ender2025"

[homepage]
  layout       = "custom"
  showRecent   = true
  recentLimit  = 10

[article]
  showReadingTime     = false
  showTableOfContents = true
  showTaxonomies      = true
  sharingLinks        = ["x-twitter", "linkedin", "bluesky", "reddit", "email"]

[list]
  showTableOfContents = true
